<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
    <defs>
        <linearGradient id="pundeer-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#09090b" />
            <stop offset="100%" stop-color="#18181b" />
        </linearGradient>
        <linearGradient id="pundeer-p" x1="10" y1="8" x2="38" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="45%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="pundeer-wave" x1="34" y1="12" x2="44" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
    </defs>
    <!-- Background squircle -->
    <rect width="48" height="48" rx="12" fill="url(#pundeer-bg)" />
    <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

    <!-- Stem of 'P' -->
    <rect x="10" y="10" width="5.5" height="28" rx="2.75" fill="url(#pundeer-p)" />

    <!-- Loop of 'P' -->
    <path d="M15.5 10H26C31.523 10 36 14.477 36 20C36 25.523 31.523 30 26 30H15.5V24.5H26C28.485 24.5 30.5 22.485 30.5 20C30.5 17.515 28.485 15.5 26 15.5H15.5V10Z" fill="url(#pundeer-p)" />

    <!-- AI Voice Waves emitting from loop -->
    <path d="M37.5 15C39.5 16.5 40.5 18.2 40.5 20C40.5 21.8 39.5 23.5 37.5 25" stroke="url(#pundeer-wave)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M41 12C43.5 14.5 44.5 17.2 44.5 20C44.5 22.8 43.5 25.5 41 28" stroke="url(#pundeer-wave)" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Spark / Pulse node -->
    <circle cx="23" cy="20" r="2.5" fill="#34d399" />
</svg>
